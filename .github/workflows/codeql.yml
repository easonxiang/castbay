# CodeQL static analysis (SAST) for the app's Kotlin code, on each push to main, each
# pull request and weekly. OpenSSF Scorecard's SAST check needs a SAST tool to have run;
# without this workflow the app scores 0 there.
#
# Scope is java-kotlin only: the native code (UxPlay, OpenSSL) is vendored third-party
# submodules built by the NDK, not the project's own code, so it is not scanned.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write # CodeQL findings to code scanning
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      # Top level only: OpenSSL's own submodules (test data, other libraries) aren't needed.
      - name: Fetch the app's submodules
        run: git submodule update --init -- third_party/UxPlay third_party/alac third_party/libplist third_party/openssl

      # AGP 8.7's prefab step fails on the newest JDKs; 21 is what Android Studio bundles.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # OpenSSL's libcrypto, built from the submodule (tools/build-openssl.sh, which Gradle runs);
      # kept between runs until the submodule or the NDK changes.
      - name: Note the OpenSSL commit
        id: openssl
        run: echo "commit=$(git rev-parse HEAD:third_party/openssl)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/openssl-android
          key: openssl-android-${{ steps.openssl.outputs.commit }}-ndk27.0.12077973

      - name: Install the pinned NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin
          build-mode: manual

      # Compiles the app's Kotlin; unit tests and lint are the Android workflow's job.
      - name: Build the app for CodeQL
        run: ./gradlew assembleDebug --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
